[package]
name = "ha-packs"
description = "Home Advisor advice packs: versioned in-binary pack data and the pure, deterministic evaluation engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ha-core = { path = "../ha-core" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
