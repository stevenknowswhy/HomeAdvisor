[package]
name = "ha-store"
description = "Home Advisor encrypted on-device persistence: SQLCipher-backed SQLite and the egress log"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The typed writer's input: the recommendation vocabulary this store persists.
ha-core = { path = "../ha-core" }
# The serving day (`NaiveDate`) the writer keys its budget row and expiry to.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Row ids for written recommendations and evidence, matching the app crate.
uuid = { version = "1", features = ["v4"] }
# SQLCipher-encrypted SQLite, compiled from source with a vendored OpenSSL so
# the encryption stack is deterministic and nothing links a system libssl.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
thiserror = "2"
zeroize = "1"

[lints]
workspace = true
