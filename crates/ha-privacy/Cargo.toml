[package]
name = "ha-privacy"
description = "Home Advisor privacy gate: deterministic redaction, local semantic leak-scan, fail-closed decision"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ha-core = { path = "../ha-core" }
ha-store = { path = "../ha-store" }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
rusqlite = "0.40"
# Loopback HTTP client for the Laya sidecar. Blocking by design (no async
# runtime in a local-first binary); TLS disabled — the sidecar is loopback-only.
ureq = { version = "2", default-features = false, features = ["json"] }

[lints]
workspace = true
