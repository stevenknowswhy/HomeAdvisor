[package]
name = "ha-app"
description = "Home Advisor desktop shell — Tauri 2 app over the ha-* crates"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ha_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
ha-store = { path = "../../crates/ha-store" }
ha-privacy = { path = "../../crates/ha-privacy" }
ha-packs = { version = "0.1.0", path = "../../crates/ha-packs" }
# The evaluation hooks read the local calendar date for the daily budget
# and the timing ladder; no network time.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# The commands read the seeded schema with raw SQL through `Store::conn()` —
# the sanctioned escape hatch for the app backend, as for the CLI demo
# (see `ha_store::Store::conn`).
rusqlite = "0.40"
# Ids for onboarding rows are generated in the Rust core, never by the
# webview; v4 is already in the tree via Tauri, so this adds no new code.
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ha-core = { version = "0.1.0", path = "../../crates/ha-core" }
serde_json = "1"
shell-words = "1"

# 256 bits of fresh entropy for a generated database key (see `keystore.rs`).
# Already in the tree via uuid's v4 feature, so this pins no new version.
getrandom = "0.4"
tauri-plugin-notification = "2"

# The first-run database key lives in the login Keychain on macOS: Apple's
# Security.framework, wrapped natively. MIT/Apache-2.0, crates.io-only, no
# network surface — the zero-telemetry audit covers it. Non-macOS targets
# keep the env-var-only key path and link none of this.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[lints]
workspace = true
