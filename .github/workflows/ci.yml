name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # The workspace now includes the Tauri app crate; the system libraries
      # below are the Tauri v2 Linux prerequisites it links against.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The zero-telemetry dependency policy (deny.toml) — bans telemetry and
  # analytics crates, licenses, RustSec advisories, crates.io-only sources.
  # The threat model (docs/threat-model.md, "Dependencies") makes this audit
  # the standing proof that the telemetry claim holds.
  cargo-deny:
    name: Zero-telemetry dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The action reads deny.toml and checks the full lockfile; no Rust
      # toolchain or Tauri system dependencies are needed.
      - uses: EmbarkStudios/cargo-deny-action@v2

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
        working-directory: app
      - name: Component tests
        run: pnpm test
        working-directory: app

  tauri-build:
    name: Tauri build & installer artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
        working-directory: app
      # `tauri build` runs the frontend build (beforeBuildCommand) and bundles
      # the deb/rpm installers in one pass.
      - name: Build installers
        run: pnpm tauri build
        working-directory: app
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: homeadvisor-installers
          # Bundles land in the workspace-root target dir, not under app/.
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  # macOS Apple Silicon build path. The Linux prerequisite apt step is absent
  # on purpose: macOS links the Tauri frameworks natively, and SQLCipher
  # compiles against the vendored OpenSSL (crates/ha-store:
  # bundled-sqlcipher-vendored-openssl), so nothing looks for a system libssl.
  tauri-build-macos:
    name: Tauri build & installer artifact (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      # The macOS-only key-management path against a real login Keychain:
      # the startup states are unit-tested on every platform, but only this
      # job can prove the Keychain round-trip end to end (and the
      # item-not-found mapping the fail-closed diagnostics rely on).
      - name: Keychain round-trip test
        run: cargo test -p ha-app --lib keychain
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
        working-directory: app
      - name: Build installers
        run: pnpm tauri build
        working-directory: app
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: homeadvisor-installers-macos
          # Bundles land in the workspace-root target dir, not under app/.
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
